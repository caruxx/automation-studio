name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies (requirements.lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compile all modules
        run: python -m compileall -q Python

      - name: Unit tests (skip is a failure)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python Python/scripts/run_tests.py

      - name: Inline handler references
        run: node Python/scripts/check_onclick_refs.js web/static/index.html

      - name: workflow.json and exit code table agree
        run: |
          cd Python
          python -c "import exit_codes as e, sys; p = e.builtin_matches_workflow(); print(p or 'ok'); sys.exit(1 if p else 0)"
