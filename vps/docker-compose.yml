services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asstudio
      POSTGRES_USER: asstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asstudio_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asstudio -d asstudio"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://asstudio:${POSTGRES_PASSWORD:-asstudio_dev}@db:5432/asstudio
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /etc/automation-studio:/etc/automation-studio:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1200m
    restart: unless-stopped

volumes:
  postgres_data:
