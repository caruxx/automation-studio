services:
  db:
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    restart: unless-stopped
    mem_limit: 1200m
    ports:
      - "127.0.0.1:8000:8000"
    # No application source bind mount is used in production. Code is copied
    # into the image by the Dockerfile; only the external keyring is mounted.
    volumes:
      - /etc/automation-studio:/etc/automation-studio:ro
    # 鍵ファイルはホスト側で uid/gid 10001(イメージ内の asstudio)所有・0600 にする。
    # コンテナを root で動かして読ませる方法は取らない。インターネットに面する
    # プロセスを不必要に root 化しないため、Dockerfile の USER asstudio をそのまま使う。
    #   install -d -m 755 /etc/automation-studio
    #   chown 10001:10001 /etc/automation-studio/keyring.json
    #   chmod 600 /etc/automation-studio/keyring.json
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
