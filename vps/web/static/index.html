<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード | Automation Studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="dashboard">
  <main>
    <header class="topbar">
      <h1>Automation Studio</h1>
      <button id="logout" class="secondary" type="button">ログアウト</button>
    </header>
    <div class="dashboard-grid">
      <section class="panel">
        <h2>ログイン情報</h2>
        <div id="user-info" class="muted">読み込み中</div>
      </section>
      <section class="panel">
        <h2>チャンネル</h2>
        <p id="channels-message" class="message" role="alert"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>channel_key</th><th>名前</th><th>既定</th><th>YouTube認証</th><th>更新日時</th><th>操作</th></tr>
            </thead>
            <tbody id="channels-body"></tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <h2>直近のジョブ</h2>
        <p id="jobs-message" class="message" role="alert"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>状態</th><th>種別</th><th>チャンネル</th><th>作成日時</th></tr>
            </thead>
            <tbody id="jobs-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
