<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | Automation Studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <main>
    <section class="auth-card">
      <h1>Automation Studio</h1>
      <form id="login-form" class="stack">
        <label>メールアドレス
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>パスワード
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>TOTPコード（設定済みの場合）
          <input id="totp-code" name="totp_code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
        </label>
        <button type="submit">ログイン</button>
        <p id="message" class="message" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
